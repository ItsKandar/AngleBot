name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un seul deploiement a la fois ; les pushes rapides annulent le precedent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Compiler les sources
        run: python -m compileall -q anglebot main.py scripts

      - name: Verification hors ligne
        env:
          DISCORD_TOKEN: verification-ci
          DISCORD_DEFAULT_CHANNEL_ID: "1"
          # Meme passerelle que dans docker-compose, pour valider les
          # sources sociales comme en production.
          RSSHUB_BASE: http://rsshub:1200
        run: python scripts/smoke_test.py

  build:
    name: Image Docker
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.nom.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Nom de l'image en minuscules
        id: nom
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" \
            >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.nom.outputs.image }}:latest
            ${{ steps.nom.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploiement
    needs: build
    # Le contexte `secrets` n'est pas lisible dans un `if` de job : on utilise
    # une variable-drapeau, a passer a "true" une fois les secrets renseignes.
    # Sans elle, le workflow construit l'image sans tenter de deployer.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Preparer la connexion SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS absent : la cle du serveur est acceptee sans verification."
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Envoyer docker-compose.yml
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/anglebot' }}
        run: |
          set -euo pipefail
          # config.yaml et .env restent la propriete du serveur : on ne
          # transmet que la definition des services.
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" docker-compose.yml \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/docker-compose.yml"

      - name: Mettre a jour les conteneurs
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/anglebot' }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "set -eu
             cd '$DEPLOY_DIR'
             test -f .env || { echo 'ERREUR : .env absent de $DEPLOY_DIR'; exit 1; }
             # Tag immuable : le conteneur redemarre sur le commit deploye.
             ANGLEBOT_TAG='$TAG' docker compose pull
             ANGLEBOT_TAG='$TAG' docker compose up -d --remove-orphans
             docker image prune -f"

      - name: Etat des services
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/anglebot' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_DIR' && docker compose ps && sleep 15 && \
             docker compose logs --tail=30 anglebot"
