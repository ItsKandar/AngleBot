name: anglebot

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  anglebot:
    # En production l'image vient de GHCR ; `docker compose up --build`
    # reconstruit depuis les sources locales pour du developpement.
    image: ${ANGLEBOT_IMAGE:-ghcr.io/itskandar/anglebot}:${ANGLEBOT_TAG:-latest}
    build: .
    container_name: anglebot
    restart: unless-stopped
    env_file: .env
    environment:
      # Ecrase la valeur du .env : dans le reseau compose, la passerelle est
      # le service voisin, jamais l'instance publique.
      RSSHUB_BASE: http://rsshub:1200
    volumes:
      # Modifier les sources ne demande qu'un redemarrage, pas un rebuild.
      - ./config.yaml:/app/config.yaml:ro
      # Volume nomme : garantit les droits d'ecriture de l'utilisateur 10001.
      - anglebot-data:/app/data
    depends_on:
      - rsshub
    logging: *logging

  rsshub:
    # chromium-bundled embarque le navigateur exige par TikTok et Threads.
    image: diygod/rsshub:chromium-bundled
    container_name: anglebot-rsshub
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/
      # Doit valoir la meme chose que RSSHUB_KEY dans .env, ou rester vide.
      ACCESS_KEY: ${RSSHUB_KEY:-}
    env_file:
      # Cookies Instagram / X. Absent = RSSHub garde ses valeurs par defaut.
      - path: ./rsshub.env
        required: false
    ports:
      # Ecoute uniquement en local, pour tester une route a la main :
      # curl "http://127.0.0.1:1200/tiktok/user/@anglegauche"
      - "127.0.0.1:1200:1200"
    depends_on:
      - redis
    healthcheck:
      # Chaine entre guillemets : un ` : ` non protege serait lu comme une cle YAML.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:1200/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 60s
      timeout: 10s
      start_period: 90s
      retries: 3
    logging: *logging

  redis:
    image: redis:7-alpine
    container_name: anglebot-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

volumes:
  anglebot-data:
  redis-data:
